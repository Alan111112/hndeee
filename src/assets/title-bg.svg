  <rect x="50" y="28" width="1" height="3"/><rect x="49" y="29" width="3" height="1"/>
  <rect x="66" y="18" width="1" height="3"/><rect x="65" y="19" width="3" height="1"/>
</g>

<!-- moon: kept clear of the top edge so a full-bleed `cover` crop on taller
     phones doesn't slice it off -->
<g fill="#fff6e8">
  <rect x="12" y="22" width="4"  height="1"/>
  <rect x="10" y="23" width="8"  height="1"/>
  <rect x="9"  y="24" width="10" height="1"/>
