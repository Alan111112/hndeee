  <rect x="34" y="18" width="1" height="1"/>
  <rect x="41" y="28" width="1" height="1"/>
  <rect x="70" y="26" width="1" height="1"/>
  <rect x="63" y="31" width="1" height="1"/>
  <rect x="17" y="33" width="1" height="1"/>
  <rect x="48" y="36" width="1" height="1"/>
  <rect x="72" y="42" width="1" height="1"/>
  <rect x="7"  y="45" width="1" height="1"/>
  <rect x="58" y="44" width="1" height="1"/>
</g>
<g fill="#ffe27a">
