<svg viewBox="0 0 80 180" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
<!-- Low-res on purpose: 80x180 scaled to ~400x900 = 5px per pixel.
     Rendered with image-rendering:pixelated so every unit stays a hard square. -->

<!-- sky bands, plum -> pink -> cream horizon glow -->
<g>
  <rect x="0" y="0"   width="80" height="16" fill="#3a1a55"/>
  <rect x="0" y="16"  width="80" height="12" fill="#4e2168"/>
  <rect x="0" y="28"  width="80" height="12" fill="#6a2a78"/>
  <rect x="0" y="40"  width="80" height="12" fill="#8d3585"/>
  <rect x="0" y="52"  width="80" height="12" fill="#b34291"/>
  <rect x="0" y="64"  width="80" height="12" fill="#d6549d"/>
  <rect x="0" y="76"  width="80" height="12" fill="#f26aa8"/>
  <rect x="0" y="88"  width="80" height="12" fill="#ff8fc4"/>
  <rect x="0" y="100" width="80" height="10" fill="#ffa9d1"/>
  <rect x="0" y="110" width="80" height="8"  fill="#ffc2e0"/>
  <rect x="0" y="118" width="80" height="8"  fill="#ffd9ec"/>
</g>

<!-- stars -->
