<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>audio test</title>
<style>
  body{font-family:system-ui,sans-serif;background:#1a1020;color:#fff;padding:16px;line-height:1.5}
  h1{font-size:18px;margin:0 0 4px}
  p{font-size:14px;color:#d9c7e8}
  .card{border:1px solid #4a2f5f;border-radius:8px;padding:12px;margin:12px 0}
  .name{font-size:13px;word-break:break-all;margin-bottom:8px;color:#ffd166}
  button{padding:10px 14px;font-size:15px;background:#ff7aa8;border:0;border-radius:6px;color:#fff;margin:0 8px 4px 0}
  .out{font-size:13px;font-weight:700;margin-top:8px;min-height:20px}
  #log{white-space:pre-wrap;font-size:12px;background:#000;padding:10px;border-radius:6px;margin-top:16px;color:#9f9}
</style>
</head>
<body>
<h1>Audio test</h1>
<p><b>Turn your volume up.</b> Tap <b>simple</b> first on the short click sound.
If <b>simple</b> plays but <b>game way</b> does not, the bug is in how the game
starts its music, not in the files.</p>

<div id="list"></div>
<div id="log">log:</div>

<script>
// Built asset paths, hashed by Vite. Verified live on the deployed site.
var tracks = [
  ['click (short - sanity check)', '/assets/buttonClickSoundEffect-BNgjU0Ap.mp3'],
  ['after hours',        '/assets/afterHoursSong-theWeekend-BlQLlkU2.MP3'],
  ['house of balloons',  '/assets/houseOfBallons-theWeekend-CBQje07y.MP3'],
  ['too close to stars', '/assets/tooclosetostars-D8wSpznV.mp3'],
  ['M',                  '/assets/M-anilEmreDaldal-NXEm2U5m.MP3']
];

var logEl = document.getElementById('log');
function log(m){ logEl.textContent += '\n' + m; }
var current = null;
function stop(){ if(current){ current.pause(); current = null; } }

function wire(a, out, tag){
  out.textContent = 'loading...'; out.style.color = '#ffd166';
  a.onplaying = function(){ out.textContent = 'PLAYING (' + tag + ')'; out.style.color = '#7CFFA0'; };
  a.onerror = function(){
    var c = a.error ? a.error.code : '?';
    out.textContent = 'ERROR code ' + c; out.style.color = '#ff6b6b';
    log(tag + ' media error code ' + c + ' on ' + a.src);
  };
}

// plain: what any ordinary page does
function simple(url, out){
  stop();
  var a = new Audio(url); a.volume = 1; current = a;
  wire(a, out, 'simple');
  a.play().then(function(){ log('simple play() resolved'); })
          .catch(function(e){
            out.textContent = 'BLOCKED: ' + e.name; out.style.color = '#ff6b6b';
            log('simple play() REJECTED: ' + e.name + ' - ' + e.message);
          });
}

// exactly what useSceneMusic does: loop, start silent, fade up over 900ms via rAF
function gameWay(url, out){
  stop();
  var a = new Audio(url); a.loop = true; a.volume = 0; a.muted = false; current = a;
  wire(a, out, 'game');
  var t0 = performance.now();
  function fade(now){
    var k = Math.min(1, (now - t0) / 900);
    a.volume = k * 0.55;
    if (k < 1) requestAnimationFrame(fade);
    else log('fade done: volume=' + a.volume.toFixed(2) + ' muted=' + a.muted + ' paused=' + a.paused);
  }
  requestAnimationFrame(fade);
  a.play().then(function(){ log('game play() resolved'); })
          .catch(function(e){
            out.textContent = 'BLOCKED: ' + e.name; out.style.color = '#ff6b6b';
            log('game play() REJECTED: ' + e.name + ' - ' + e.message);
          });
}

var list = document.getElementById('list');
tracks.forEach(function(t){
  var label = t[0], url = t[1];
  var card = document.createElement('div'); card.className = 'card';
  var n = document.createElement('div'); n.className = 'name'; n.textContent = label + '  ->  ' + url;
  var out = document.createElement('div'); out.className = 'out'; out.textContent = '-';
  var b1 = document.createElement('button'); b1.textContent = 'simple'; b1.onclick = function(){ simple(url, out); };
  var b2 = document.createElement('button'); b2.textContent = 'game way'; b2.onclick = function(){ gameWay(url, out); };
  var b3 = document.createElement('button'); b3.textContent = 'stop'; b3.onclick = stop;
  card.appendChild(n); card.appendChild(b1); card.appendChild(b2); card.appendChild(b3); card.appendChild(out);
  list.appendChild(card);
});

log('ready');
log('browser: ' + navigator.userAgent);
</script>
</body>
</html>
